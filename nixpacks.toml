[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.bcmath",
  "php82Extensions.curl",
  "php82Extensions.dom",
  "php82Extensions.fileinfo",
  "php82Extensions.pdo_mysql",
  "php82Extensions.xml",
  "php82Extensions.zip"
]

[phases.install]
cmds = [
  "composer install --no-interaction --prefer-dist --optimize-autoloader"
]

[start]
cmd = "php artisan config:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
